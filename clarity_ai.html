<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>Clarity AI · Search</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: #f4f6fa; color: #1a202c; min-height: 100vh;
      padding: 1.2rem 1rem 2rem; display: flex; flex-direction: column; align-items: center;
    }
    .container { max-width: 720px; width: 100%; margin: 0 auto; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 1.8rem; font-size: 1.6rem; font-weight: 700; letter-spacing: -0.5px; }
    .brand svg { width: 32px; height: 32px; stroke: #2563eb; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .brand span { background: linear-gradient(135deg, #2563eb, #7c3aed); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .brand small { font-size: .7rem; font-weight: 400; background: #e2e8f0; padding: 2px 10px; border-radius: 30px; -webkit-text-fill-color: #475569; color: #475569; margin-left: 4px; }
    .search-wrap { display: flex; align-items: center; background: white; border-radius: 60px; box-shadow: 0 8px 30px rgba(0,0,0,.06); padding: 4px 4px 4px 18px; border: 1px solid #e9edf4; transition: box-shadow .2s,border .2s; }
    .search-wrap:focus-within { box-shadow: 0 8px 30px rgba(37,99,235,.15); border-color: #2563eb; }
    .search-wrap input { flex: 1; border: none; outline: none; font-size: 1rem; padding: 14px 0; background: transparent; color: #1a202c; min-width: 0; -webkit-appearance: none; }
    .search-wrap input::placeholder { color: #94a3b8; }
    .search-wrap button { background: #2563eb; border: none; border-radius: 40px; padding: 10px 18px; color: white; font-weight: 600; font-size: .95rem; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: background .2s,transform .1s; white-space: nowrap; min-height: 48px; touch-action: manipulation; }
    .search-wrap button:active { transform: scale(.95); background: #1d4ed8; }
    .search-wrap button svg { width: 18px; height: 18px; stroke: white; stroke-width: 2.5; fill: none; }
    .key-toggle { margin-top: 10px; font-size: .8rem; color: #64748b; text-align: right; }
    .key-toggle button { background: none; border: none; color: #2563eb; cursor: pointer; font-size: .8rem; text-decoration: underline; padding: 4px 8px; touch-action: manipulation; }
    .key-field { display: none; margin-top: 8px; gap: 8px; align-items: center; flex-wrap: wrap; }
    .key-field.active { display: flex; }
    .key-field input { flex: 1; padding: 10px 14px; border-radius: 30px; border: 1px solid #d1d9e6; font-size: .9rem; min-width: 150px; background: white; }
    .key-field input:focus { outline: 2px solid #2563eb; border-color: transparent; }
    .key-field .save-key { background: #1a202c; color: white; border: none; padding: 10px 18px; border-radius: 30px; font-weight: 500; cursor: pointer; touch-action: manipulation; }
    .suggestions { background: white; border-radius: 20px; margin-top: 8px; box-shadow: 0 12px 40px rgba(0,0,0,.08); border: 1px solid #e9edf4; overflow: hidden; display: none; max-height: 260px; overflow-y: auto; }
    .suggestions.active { display: block; }
    .suggestions div { padding: 14px 20px; cursor: pointer; font-size: .95rem; border-bottom: 1px solid #f1f5f9; touch-action: manipulation; }
    .suggestions div:active { background: #eef2f6; }
    .suggestions div:last-child { border-bottom: none; }
    .ai-answer { background: white; border-radius: 24px; padding: 1.5rem 1.2rem; margin-top: 1.8rem; border-left: 5px solid #7c3aed; box-shadow: 0 4px 16px rgba(0,0,0,.03); border: 1px solid #edf2f7; border-left-width: 5px; display: none; }
    .ai-answer.active { display: block; }
    .ai-answer .label { font-size: .7rem; text-transform: uppercase; letter-spacing: .5px; color: #7c3aed; font-weight: 700; margin-bottom: 8px; }
    .ai-answer .answer-text { font-size: 1.05rem; line-height: 1.7; color: #1e293b; }
    .ai-answer .answer-text p { margin-bottom: .8rem; }
    .ai-answer .answer-text p:last-child { margin-bottom: 0; }
    .sources { margin-top: 1.2rem; display: none; }
    .sources.active { display: block; }
    .sources .source-title { font-size: .85rem; font-weight: 600; color: #475569; margin-bottom: 10px; }
    .source-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f1f5f9; }
    .source-item:last-child { border-bottom: none; }
    .source-item .idx { background: #eef2f6; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: .7rem; font-weight: 600; color: #475569; flex-shrink: 0; }
    .source-item a { color: #2563eb; text-decoration: none; font-size: .9rem; word-break: break-all; flex: 1; }
    .source-item a:active { opacity: .6; }
    .loader { display: none; justify-content: center; margin: 2rem 0; }
    .loader.active { display: flex; }
    .spinner { width: 36px; height: 36px; border: 4px solid #e2e8f0; border-top-color: #2563eb; border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-state { text-align: center; color: #94a3b8; padding: 2.5rem 0; font-size: 1rem; }
    .empty-state strong { color: #475569; }
    .error-msg { color: #b91c1c; background: #fee2e2; padding: 12px 18px; border-radius: 16px; font-size: .9rem; margin-top: 1rem; }
    .footer { margin-top: 2.5rem; font-size: .75rem; color: #94a3b8; text-align: center; border-top: 1px solid #e2e8f0; padding-top: 1.5rem; width: 100%; }
    @media (max-width: 500px) {
      body { padding: .8rem .8rem 1.5rem; }
      .brand { font-size: 1.3rem; margin-bottom: 1.2rem; }
      .search-wrap { padding-left: 14px; border-radius: 40px; }
      .search-wrap input { font-size: .95rem; padding: 12px 0; }
      .search-wrap button { padding: 8px 14px; font-size: .85rem; min-height: 42px; }
      .search-wrap button span { display: none; }
      .ai-answer { padding: 1rem; border-left-width: 4px; }
      .ai-answer .answer-text { font-size: .95rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="2" x2="12" y2="22"/>
        <line x1="2" y1="12" x2="22" y2="12"/><path d="M4 4 L20 20"/><path d="M4 20 L20 4"/>
      </svg>
      <span>Clarity</span><small>AI</small>
    </div>

    <form class="search-wrap" id="searchForm" autocomplete="off">
      <input type="text" id="searchInput" placeholder="Ask anything…" aria-label="Search"/>
      <button type="submit" aria-label="Search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <span>Search</span>
      </button>
    </form>

    <div class="key-toggle">
      <button type="button" id="toggleKey">🔑 Enter API key (optional)</button>
    </div>
    <div class="key-field" id="keyField">
      <input type="password" id="apiKeyInput" placeholder="Paste your Tavily key…" autocomplete="off"/>
      <button class="save-key" id="saveKeyBtn">Save</button>
    </div>

    <div class="suggestions" id="suggestions"></div>
    <div class="loader" id="loader" aria-live="polite"><div class="spinner"></div></div>

    <div class="ai-answer" id="aiAnswer" aria-live="polite">
      <div class="label">🧠 AI Answer</div>
      <div class="answer-text" id="answerText"></div>
    </div>

    <div class="sources" id="sources">
      <div class="source-title">📚 Sources</div>
      <div id="sourceList"></div>
    </div>

    <div class="results" id="results"></div>
    <div class="footer">Powered by Tavily AI &bull; Check the service's privacy policy for data handling.</div>
  </div>

  <script>
    (() => {
      const form = document.getElementById('searchForm');
      const input = document.getElementById('searchInput');
      const suggestions = document.getElementById('suggestions');
      const results = document.getElementById('results');
      const loader = document.getElementById('loader');
      const aiAnswer = document.getElementById('aiAnswer');
      const answerText = document.getElementById('answerText');
      const sourcesDiv = document.getElementById('sources');
      const sourceList = document.getElementById('sourceList');
      const toggleKeyBtn = document.getElementById('toggleKey');
      const keyField = document.getElementById('keyField');
      const apiKeyInput = document.getElementById('apiKeyInput');
      const saveKeyBtn = document.getElementById('saveKeyBtn');

      let abortController = null;
      let apiKey = localStorage.getItem('tavily_key') || '';
      if (apiKey) apiKeyInput.value = apiKey;

      const showLoader = show => loader.classList.toggle('active', show);

      function clearAll() {
        aiAnswer.classList.remove('active');
        sourcesDiv.classList.remove('active');
        results.replaceChildren();
        sourceList.replaceChildren();
        answerText.replaceChildren();
      }

      function showError(msg) {
        results.replaceChildren();
        const div = document.createElement('div');
        div.className = 'error-msg';
        div.textContent = '⚠️ ' + msg;
        results.appendChild(div);
      }

      async function performAISearch(query) {
        const currentQuery = query.trim();
        if (!currentQuery) return;

        clearAll();
        showLoader(true);

        if (abortController) abortController.abort();
        abortController = new AbortController();

        const keyToUse = apiKey || 'tvly-keyless';

        try {
          const response = await fetch('https://api.tavily.com/search', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${keyToUse}`,
              ...(keyToUse === 'tvly-keyless' && { 'X-Tavily-Access-Mode': 'keyless' })
            },
            body: JSON.stringify({
              query: currentQuery,
              search_depth: 'basic',
              include_answer: true,
              include_sources: true,
              max_results: 5
            }),
            signal: abortController.signal
          });

          if (!response.ok) {
            let msg = `Tavily error (${response.status})`;
            if (response.status === 401 || response.status === 403) msg = 'Invalid API key. Please enter a valid key or use keyless mode.';
            else if (response.status === 429) msg = 'Rate limit exceeded. Enter a free API key for more credits.';
            throw new Error(msg);
          }

          const data = await response.json();

          if (data.answer) {
            aiAnswer.classList.add('active');
            answerText.replaceChildren();
            String(data.answer).split('\n').filter(p => p.trim()).forEach(text => {
              const p = document.createElement('p');
              p.textContent = text;
              answerText.appendChild(p);
            });
          } else {
            const empty = document.createElement('div');
            empty.className = 'empty-state';
            empty.textContent = `No AI answer found for “${currentQuery}”`;
            results.appendChild(empty);
          }

          if (Array.isArray(data.results) && data.results.length) {
            sourcesDiv.classList.add('active');
            sourceList.replaceChildren();

            data.results.forEach((item, idx) => {
              const row = document.createElement('div');
              row.className = 'source-item';

              const number = document.createElement('span');
              number.className = 'idx';
              number.textContent = String(idx + 1);

              const link = document.createElement('a');
              const url = typeof item.url === 'string' ? item.url : '';
              link.href = url || '#';
              link.target = '_blank';
              link.rel = 'noopener noreferrer';
              link.textContent = item.title || url || 'Source';

              row.append(number, link);
              sourceList.appendChild(row);
            });
          }
        } catch (error) {
          if (error.name !== 'AbortError') showError(error.message || 'Something went wrong. Please try again.');
        } finally {
          showLoader(false);
          abortController = null;
        }
      }

      async function fetchSuggestions(query) {
        if (!query.trim()) {
          suggestions.classList.remove('active');
          return;
        }

        try {
          const url = `https://en.wikipedia.org/w/api.php?action=opensearch&search=${encodeURIComponent(query)}&limit=5&namespace=0&format=json&origin=*`;
          const resp = await fetch(url);
          if (!resp.ok) throw new Error('Suggestion request failed');
          const data = await resp.json();
          const titles = Array.isArray(data[1]) ? data[1] : [];

          suggestions.replaceChildren();
          if (!titles.length) {
            suggestions.classList.remove('active');
            return;
          }

          titles.forEach(title => {
            const el = document.createElement('div');
            el.textContent = title;
            el.tabIndex = 0;
            el.addEventListener('click', () => {
              input.value = title;
              suggestions.classList.remove('active');
              performAISearch(title);
            });
            el.addEventListener('keydown', e => {
              if (e.key === 'Enter') {
                input.value = title;
                suggestions.classList.remove('active');
                performAISearch(title);
              }
            });
            suggestions.appendChild(el);
          });

          suggestions.classList.add('active');
        } catch {
          suggestions.classList.remove('active');
        }
      }

      let suggestTimer = null;
      input.addEventListener('input', () => {
        clearTimeout(suggestTimer);
        const val = input.value;
        suggestTimer = setTimeout(() => fetchSuggestions(val), 250);
        if (!val.trim()) suggestions.classList.remove('active');
      });

      form.addEventListener('submit', e => {
        e.preventDefault();
        const val = input.value.trim();
        if (!val) return;
        suggestions.classList.remove('active');
        performAISearch(val);
      });

      document.addEventListener('click', e => {
        if (!e.target.closest('.search-wrap') && !e.target.closest('.suggestions')) {
          suggestions.classList.remove('active');
        }
      });

      toggleKeyBtn.addEventListener('click', () => keyField.classList.toggle('active'));

      saveKeyBtn.addEventListener('click', () => {
        const key = apiKeyInput.value.trim();
        if (key) {
          apiKey = key;
          localStorage.setItem('tavily_key', key);
          alert('✅ API key saved locally in this browser.');
          keyField.classList.remove('active');
        } else {
          localStorage.removeItem('tavily_key');
          apiKey = '';
          alert('🔓 Key removed. Will use keyless mode.');
        }
      });

      apiKeyInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') saveKeyBtn.click();
      });

      const initial = document.createElement('div');
      initial.className = 'empty-state';
      initial.innerHTML = '🔎 Ask anything – AI will find the answer';
      results.appendChild(initial);
    })();
  </script>
</body>
</html>
